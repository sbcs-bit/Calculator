<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>

    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .calculator {
            width: 280px;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
        }

        #display {
            width: 100%;
            height: 50px;
            font-size: 25px;
            text-align: right;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            width: 60px;
            height: 50px;
            margin: 3px;
            font-size: 20px;
            cursor: pointer;
        }

        .equal {
            width: 128px;
        }
    </style>
</head>

<body>

<div class="calculator">

    <input type="text" id="display" readonly>

    <div>
        <button onclick="clearDisplay()">CLR</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="addDis('/')">÷</button>
        <button onclick="addDis('*')">×</button>
    </div>

    <div>
        <button onclick="addDis('7')">7</button>
        <button onclick="addDis('8')">8</button>
        <button onclick="addDis('9')">9</button>
        <button onclick="addDis('-')">−</button>
    </div>

    <div>
        <button onclick="addDis('4')">4</button>
        <button onclick="addDis('5')">5</button>
        <button onclick="addDis('6')">6</button>
        <button onclick="addDis('+')">+</button>
    </div>

    <div>
        <button onclick="addDis('1')">1</button>
        <button onclick="addDis('2')">2</button>
        <button onclick="addDis('3')">3</button>
        <button onclick="calculate()">=</button>
    </div>

    <div>
        <button onclick="addDis('0')">0</button>
        <button onclick="addDis('.')">.</button>
    </div>

</div>

<script>

    let d = document.getElementById("display");

    function addDis(value) {
        d.value += value;
    }

    function clearDisplay() {
        d.value = "";
    }

    function deleteLast() {
        d.value = display.value.slice(0, -1);
    }

    function calculate() {

        try {
            d.value = eval(d.value);
        }
        catch {
            d.value = "Error";
        }
    }

</script>

</body>
</html>
